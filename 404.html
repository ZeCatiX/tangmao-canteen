<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>页面走丢了 · 唐猫庭院</title>
<style>
  :root{--primary:#b83a2a;--gold:#c9a96e;--cream:#faf6f0;--ink:#2c1810;--text-light:#756558;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:'Noto Serif SC','STSong','SimSun',serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .box{text-align:center;max-width:480px;}
  .box img{width:min(360px,86vw);display:block;margin:0 auto 18px;border-radius:16px;box-shadow:0 10px 30px rgba(60,30,10,.14);}
  h1{font-size:1.6rem;letter-spacing:6px;margin:0 0 10px;font-weight:900;}
  p{color:var(--text-light);font-size:.95rem;line-height:1.9;margin:0 0 22px;}
  a.btn{display:inline-block;text-decoration:none;color:#fff;background:linear-gradient(135deg,var(--primary),#d0453a);padding:10px 34px;border-radius:22px;font-size:.95rem;letter-spacing:3px;box-shadow:0 4px 14px rgba(184,58,42,.35);}
  a.btn:hover{opacity:.92;}
  .code{margin-top:14px;font-size:.75rem;color:#a08b6a;letter-spacing:2px;}
</style>
</head>
<body>
  <div class="box">
    <img src="/assets/illustrations/cat-404.webp" alt="唐猫不小心打翻了托盘">
    <h1>页面走丢了</h1>
    <p>小唐猫不小心打翻了托盘，找不到这个页面。<br>回首页看看今天的推荐吧。</p>
    <a class="btn" href="/">回唐猫庭院</a>
    <div class="code">404 · NOT FOUND</div>
  </div>
</body>
</html>
