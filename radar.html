<script>
var RAW=[0,205,5.1,88.6,71.3,47.3,108.5,108.9,120.3,139.4,92.8,172.8];
var NORM=[144,220,145.9,176.9,170.5,161.5,184.2,184.4,188.6,195.7,178.4,208.1];
var CX=450, CY=348;
function ang(i){return (i*30-90)*Math.PI/180;}
function ptsAt(k){
 return RAW.map(function(r0,i){
  var r=r0+(NORM[i]-r0)*k;
  var a=ang(i);
  return [(CX+r*Math.cos(a)).toFixed(1), (CY+r*Math.sin(a)).toFixed(1)];
 });
}
function frame(t){
 var k=Math.min(t,1);
 var ease=k<0.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
 var p=ptsAt(ease);
 document.getElementById("dataPoly").setAttribute("points",p.map(function(q){return q.join(",");}).join(" "));
 var ds=document.querySelectorAll(".vdot");
 for(var i=0;i<ds.length;i++){ds[i].setAttribute("cx",p[i][0]);ds[i].setAttribute("cy",p[i][1]);}
 var ss=document.querySelectorAll(".vspoke");
 for(var j=0;j<ss.length;j++){ss[j].setAttribute("x2",p[j][0]);ss[j].setAttribute("y2",p[j][1]);}
 var faceO=Math.max(0,Math.min(1,(t-1.3)/0.7));
 document.getElementById("catFace").setAttribute("opacity",faceO.toFixed(2));
}
function play(){
 var t0=performance.now(), DUR=3200;
 function step(now){
  var t=Math.min(1,(now-t0)/DUR)*2;
  frame(t);
  if(t<2)requestAnimationFrame(step);
 }
 requestAnimationFrame(step);
}
window.addEventListener("load",function(){setTimeout(play,400);});
document.getElementById("replayBtn").addEventListener("click",play);
</script>
