name: CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: tangmao_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          npm ci
          pip install scikit-learn pandas numpy psycopg2-binary

      - name: Lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Init database
        run: |
          # sample_data.sql 只建表+示例用户；末尾示例 feedback 会因菜品未插入报 FK 错（预期，psql 默认不中断）
          PGPASSWORD=testpass psql -h localhost -U postgres -d tangmao_test -f sample_data.sql
          # 116 道正式菜品快照（TRUNCATE CASCADE 顺带清掉空的 feedback 表）
          PGPASSWORD=testpass psql -h localhost -U postgres -d tangmao_test -v ON_ERROR_STOP=1 -f dishes_seed.sql

      - name: Start server
        env:
          PG_HOST: localhost
          PG_PORT: 5432
          PG_DATABASE: tangmao_test
          PG_USER: postgres
          PG_PASSWORD: testpass
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-only-test-secret-0123456789abcdef' }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASS || 'ci-admin-test-pass' }}
          TABLE_SECRET: ${{ secrets.TABLE_SECRET || 'ci-table-secret-0123456789abcdef' }}
          LOGIN_RATE_LIMIT_MAX: 200
        run: |
          nohup node server.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/ > /dev/null; then
              echo "服务器已就绪（第 ${i} 秒）"
              exit 0
            fi
            sleep 1
          done
          echo "::error::服务器 30 秒内未就绪"
          cat server.log
          exit 1

      - name: Run API tests
        env:
          PG_HOST: localhost
          PG_PORT: 5432
          PG_DATABASE: tangmao_test
          PG_USER: postgres
          PG_PASSWORD: testpass
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-only-test-secret-0123456789abcdef' }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASS || 'ci-admin-test-pass' }}
          TABLE_SECRET: ${{ secrets.TABLE_SECRET || 'ci-table-secret-0123456789abcdef' }}
          LOGIN_RATE_LIMIT_MAX: 200
        run: npm test

      - name: Run E2E tests
        env:
          PG_HOST: localhost
          PG_PORT: 5432
          PG_DATABASE: tangmao_test
          PG_USER: postgres
          PG_PASSWORD: testpass
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-only-test-secret-0123456789abcdef' }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASS || 'ci-admin-test-pass' }}
          TABLE_SECRET: ${{ secrets.TABLE_SECRET || 'ci-table-secret-0123456789abcdef' }}
          LOGIN_RATE_LIMIT_MAX: 200
        run: npm run test:all

      - name: Security audit
        run: npm audit --omit=dev

  deploy:
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /path/to/部署目录
            git pull
            npm ci --omit=dev
            npm run build
            pm2 restart tangmao